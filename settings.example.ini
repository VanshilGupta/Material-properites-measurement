# ============================================================================
#  Thermoelectric Measurement System — runtime settings (TEMPLATE)
# ============================================================================
#  Copy this file to "settings.ini" next to the application and edit it.
#  Lines starting with '#' or ';' are comments; "  # text" after a value is
#  also ignored.  Restart the app after changes.
#
#  settings.ini holds machine-specific values and the remote token, so it is
#  git-ignored.  This template is the committed reference.
#  Every key is optional — a missing key falls back to a safe built-in default.
# ============================================================================

[mode]
# remote = true   → instruments are on ANOTHER PC; talk to it over the network
#                   (that PC must be running instrument_server.py)
# remote = false  → instruments are connected to THIS PC via USB / serial
remote = false

[remote]
# Only used when remote = true.
# LAN IP (or hostname) of the lab PC running instrument_server.py
host  = localhost
port  = 8765
# Shared secret — must match the token configured on the lab PC
token =

[instruments]
# VISA resource strings. Find yours with:
#   python -c "import pyvisa; print(pyvisa.ResourceManager().list_resources())"
daq_resource = USB0::0x05E6::0x6510::04619482::0::INSTR
ps_resource  = USB0::0x05E6::0x2230::805224014787570003::0::INSTR

[eurotherm]
# COM port to try FIRST (5 → COM5; see Windows Device Manager).
com_port       = 5
device_address = 1      # MODBUS device address
baud_rate      = 9600
timeout        = 2.0    # serial read timeout, seconds

# auto_detect = true  → if com_port does not answer, list every serial port on
#                       the PC and probe each one for the Eurotherm (MODBUS
#                       read of the process value) until one replies.
# auto_detect = false → only ever use com_port; fail if it does not work.
# On a remote setup this runs on the LAB PC (its settings.ini), not the GUI PC.
auto_detect    = true
probe_timeout  = 1.0    # seconds to wait for a reply from each probed port

[sample]
default_thickness_mm = 2.1
default_diameter_mm  = 15
